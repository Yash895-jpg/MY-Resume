
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Yash Gajjar's professional resume. React.js developer and frontend development enthusiast based in Ahmedabad, Gujarat.">
  <title>Yash Gajjar | Resume</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #f1f5f9;
      background: radial-gradient(circle at top, #1e3a5f, #0b1120 65%);
    }

    .card {
      width: 100%;
      max-width: 680px;
      padding: 48px 28px;
      text-align: center;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid #334155;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(0,0,0,.3);
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid #475569;
      border-radius: 50px;
      color: #93c5fd;
      font-size: 13px;
    }

    h1 {
      margin: 22px 0 10px;
      font-size: clamp(32px, 7vw, 48px);
    }

    h2 {
      margin: 0;
      color: #93c5fd;
      font-size: 18px;
      font-weight: 500;
    }

    p {
      max-width: 480px;
      margin: 20px auto;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: transform .2s, background .2s;
    }

    .btn:hover { transform: translateY(-2px); }

    .primary {
      background: #2563eb;
      color: white;
    }

    .primary:hover { background: #1d4ed8; }

    .secondary {
      border: 1px solid #475569;
      color: #f8fafc;
    }

    .secondary:hover { background: #1e293b; }

    .footer {
      margin-top: 34px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">PROFESSIONAL RESUME</span>

    <h1>Yash Gajjar</h1>
    <h2>React.js Developer | Frontend Development</h2>

    <p>
      Welcome to my resume page. Explore my professional
      background, frontend development skills, internship
      experience, and projects.
    </p>

    <div class="buttons">
      <a class="btn primary"
         href="./Yash_Gajjar_Resume.pdf"
         target="_blank"
         rel="noopener noreferrer">
        View Resume ↗
      </a>

      <a class="btn secondary"
         href="./Yash_Gajjar_Resume.pdf"
         download="Yash_Gajjar_Resume.pdf">
        Download Resume ↓
      </a>
    </div>

    
  </main>
</body>
</html>
